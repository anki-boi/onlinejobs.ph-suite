[project]
name = "job-hunter"
version = "0.1.0"
description = "Job Hunter — onlinejobs.ph scraper, local dashboard, and resume tooling for one user on one machine"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# W1.1: only codes the codebase already passes. W1.3/W2.10 widen to the full
# "F" set and clear the 25 pre-existing unused import/assignment findings.
select = ["E9", "F63", "F7", "F811", "F821"]
