[project]
name = "job-hunter"
version = "0.1.0"
description = "Job Hunter — onlinejobs.ph scraper, local dashboard, and resume tooling for one user on one machine"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# W1.3: widened to the full F set (unused imports/vars, undefined names, bad
# star imports, f-string placeholders) — the 27 pre-existing findings were cleared.
select = ["E9", "F"]
